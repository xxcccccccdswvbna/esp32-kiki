name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'ct1.yaml'
      - 'fan_light.h'
      - 'ble_gateway.h'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空自动生成)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            DATE=$(date +'%Y.%m.%d')
            BUILD_NUM=$(git tag --list "v${DATE}-*" | wc -l)
            BUILD_NUM=$((BUILD_NUM + 1))
            VERSION="v${DATE}-${BUILD_NUM}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install esphome

      - name: Create secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "CC"
          wifi_password: "chen1122"
          api_key: "dummy"
          mqtt_broker: "192.168.6.88"
          mqtt_user: ""
          mqtt_pass: ""
          EOF

      - name: Generate version.h
        run: |
          cat > version.h << EOF
          #pragma once
          #define FIRMWARE_VERSION "${{ steps.version.outputs.version }}"
          #define FIRMWARE_BUILD_DATE "$(date +%Y-%m-%d)"
          #define FIRMWARE_GIT_COMMIT "${{ github.sha }}"
          EOF

      - name: Build
        run: |
          esphome compile ct1.yaml
          BUILD_DIR=$(find .esphome/build -name "ct1" -type d | head -1)
          mkdir -p dist
          find "$BUILD_DIR" -name "*.bin" -exec cp {} dist/ \
          echo "### CT1 BLE Gateway ${{ steps.version.outputs.version }}" > dist/RELEASE.md
          echo "Build: $(date '+%Y-%m-%d %H:%M:%S')" >> dist/RELEASE.md
          echo "Commit: ${{ github.sha }}" >> dist/RELEASE.md
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ct1-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 90

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "CT1 ${{ steps.version.outputs.version }}"
          body_path: dist/RELEASE.md
          files: dist/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
