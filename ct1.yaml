esphome:
  name: ct1
  friendly_name: CT1 BLE Gateway
  includes:
    - version.h

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_BT_ENABLED: y
      CONFIG_BT_BLE_ENABLED: y

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "CT1 Fallback"
    password: "12345678"

captive_portal:
web_server:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome

mqtt:
  broker: !secret mqtt_broker
  on_message:
    - topic: "ct1/ble/send"
      then:
        - lambda: |-
            id(ct1_ble).send_hex(x);

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: false

# ===== 外部组件（替代 custom_component）=====
external_components:
  - source:
      type: local
      path: components

# ===== 使用组件 =====
ct1_ble:
  id: ct1_ble
